name: mining-adas-acw
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10

  # Deep learning + CUDA wheels
  - pytorch=2.1.2
  - torchvision=0.16.2
  - pytorch-cuda=12.1

  # Scientific stack
  - numpy=1.26.4
  - scipy=1.11.4
  - pandas=2.1.4
  - pyarrow=15.0.0
  - scikit-learn=1.3.2
  - scikit-image=0.22.0

  # Image / video I/O
  - opencv=4.9.0
  - pillow=10.2.0
  - imageio=2.34.0
  - imageio-ffmpeg=0.4.9
  - ffmpeg=6.1

  # Plotting
  - matplotlib-base=3.8.2
  - seaborn=0.13.2

  # Notebook environment
  - jupyterlab=4.1.5
  - ipywidgets=8.1.2
  - tqdm=4.66.2

  # CLI / utilities
  - pyyaml=6.0.1
  - addict=2.4.0
  - yapf=0.40.2
  - termcolor=2.4.0
  - packaging=23.2

  - pip
  - pip:
      - openmim==0.3.9
      - ffmpeg-python==0.2.0
      # The MMCV/MMSegmentation wheels are installed in a second step:
      #     mim install "mmengine>=0.10,<0.11"
      #     mim install "mmcv==2.1.0"
      #     mim install "mmsegmentation==1.2.2"
